name: Release macOS

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
          printf '%s' "$CERTIFICATE_P12" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

      - name: Test and build signed Universal app
        env:
          COMPUTER_USE_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          pnpm run typecheck
          pnpm run test
          pnpm run test:native
          pnpm run build

      - name: Notarize and package DMG
        env:
          COMPUTER_USE_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          APPLE_API_KEY_PATH="$KEY_PATH" pnpm run release:macos

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.dmg release/*.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.dmg release/*.sha256 --generate-notes --verify-tag
          fi

      - name: Update Homebrew Cask
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          test -n "$HOMEBREW_TAP_DEPLOY_KEY"
          KEY_PATH="$RUNNER_TEMP/homebrew-tap-deploy-key"
          KNOWN_HOSTS="$RUNNER_TEMP/github-known-hosts"
          TAP_DIR="$RUNNER_TEMP/homebrew-tap"
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$KNOWN_HOSTS"
          export GIT_SSH_COMMAND="ssh -i $KEY_PATH -o IdentitiesOnly=yes -o UserKnownHostsFile=$KNOWN_HOSTS"
          git clone git@github.com:ZRui-C/homebrew-tap.git "$TAP_DIR"

          VERSION="${GITHUB_REF_NAME#v}"
          CHECKSUM_FILE="release/DSH-Computer-Use-${VERSION}-universal.dmg.sha256"
          SHA256="$(awk '{print $1}' "$CHECKSUM_FILE")"
          node scripts/update-homebrew-cask.mjs "$TAP_DIR/Casks/dsh-computer-use.rb" "$VERSION" "$SHA256"

          git -C "$TAP_DIR" config user.name "github-actions[bot]"
          git -C "$TAP_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$TAP_DIR" add Casks/dsh-computer-use.rb
          if git -C "$TAP_DIR" diff --cached --quiet; then
            echo "Homebrew Cask is already current."
            exit 0
          fi
          git -C "$TAP_DIR" commit -m "dsh-computer-use ${VERSION}"
          git -C "$TAP_DIR" push origin main
